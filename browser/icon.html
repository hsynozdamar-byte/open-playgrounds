<!doctype html><html><head><meta charset="utf-8"><style>
/* Playground Browser ikonu: Playgrounds'un açık pastel karosu (mac/icon.html ile kardeş), ortada Playgrounds küresi (../mac/icon-orb.png)
   üstünde ince beyaz meridyen ve enlem çizgileri: küre dünya olur, tarayıcı. Çıktı: node browser/icon.mjs → icon-1024.png */
:root { --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1.4 -0.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
.tile { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px; overflow: hidden; isolation: isolate;
  background: radial-gradient(90% 80% at 18% 6%, #ffffff 30%, transparent 70%), radial-gradient(80% 70% at 100% 100%, #e3f7f3, transparent 70%), radial-gradient(70% 70% at 0% 100%, #efe6fd, transparent 70%), #f6f3fb;
  box-shadow: 0 10px 24px rgba(20,24,40,.16), inset 0 0 0 1px rgba(0,0,0,.05), inset 0 2px 0 rgba(255,255,255,.9); }
.tile::after { content: ""; position: absolute; inset: 0; background: var(--grain); background-size: 220px; mix-blend-mode: multiply; opacity: .16; }
/* Küre görselinin merkezi (280,275)/560, yarıçap ~238: 680 px'te merkez karonun ortasına gelir. */
.orb { position: absolute; left: 72px; top: 78px; width: 680px; height: 680px; filter: drop-shadow(0 26px 34px rgba(120, 90, 200, .22)); }
svg { position: absolute; inset: 0; }
</style></head><body>
<div class="tile">
  <img class="orb" src="../mac/icon-orb.png" alt="">
  <svg viewBox="0 0 824 824"><defs><clipPath id="c"><circle cx="412" cy="412" r="276"/></clipPath></defs>
    <g clip-path="url(#c)" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".6" transform="rotate(-18 412 412)">
      <circle cx="412" cy="412" r="270"/>
      <ellipse cx="412" cy="412" rx="128" ry="270"/>
      <line x1="412" y1="130" x2="412" y2="694"/>
      <path d="M142 412 A270 64 0 0 0 682 412"/>
      <path d="M187 262 A225 48 0 0 0 637 262"/>
      <path d="M187 562 A225 48 0 0 0 637 562"/>
    </g>
  </svg>
</div>
</body></html>
