<!doctype html><html><head><meta charset="utf-8"><style>
/* Playgrounds ikonu: Rou'nun pastel tonlarında taneli açık karo; ortada yalnız Rou. icon-orb.png = PlaygroundsOrb 560 px karesi, icon-rou.png = RouMascot 720 px
   (uygulamadan headless ekran görüntüsü, şeffaf). Karo ayrıca public/apple-touch-icon.png (512 px; Run Local ve ana ekran ikonu).
   Çıktı: node mac/icon.mjs → mac/icon-1024.png */
:root { --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1.4 -0.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
.tile { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px; overflow: hidden; isolation: isolate;
  background: radial-gradient(90% 80% at 18% 6%, #ffffff 30%, transparent 70%), radial-gradient(80% 70% at 100% 100%, #e3f7f3, transparent 70%), radial-gradient(70% 70% at 0% 100%, #efe6fd, transparent 70%), #f6f3fb;
  box-shadow: 0 10px 24px rgba(20,24,40,.16), inset 0 0 0 1px rgba(0,0,0,.05), inset 0 2px 0 rgba(255,255,255,.9); }
.tile::after { content: ""; position: absolute; inset: 0; background: var(--grain); background-size: 220px; mix-blend-mode: multiply; opacity: .16; }
.orb { position: absolute; left: 70px; top: 56px; width: 560px; height: 560px; }
.rou { position: absolute; left: 92px; top: 100px; width: 640px; height: 640px; filter: drop-shadow(0 22px 28px rgba(120, 90, 200, .22)); }
</style></head><body>
<div class="tile"><img class="rou" src="icon-rou.png" alt=""></div>
</body></html>
